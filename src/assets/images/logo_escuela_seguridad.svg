<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="100%" height="100%">
  <defs>
    <!-- Paleta del Tríptico Oficial: Deep Navy / Petrol Teal / Bright Cyan -->
    <linearGradient id="secShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B2032" />
      <stop offset="50%" stopColor="#071626" />
      <stop offset="100%" stopColor="#040D18" />
    </linearGradient>
    <linearGradient id="secCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#00C4D8" />
      <stop offset="50%" stopColor="#0A7D8C" />
      <stop offset="100%" stopColor="#00E5FF" />
    </linearGradient>
    <linearGradient id="secTealRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00C4D8" />
      <stop offset="40%" stopColor="#009688" />
      <stop offset="100%" stopColor="#094B5C" />
    </linearGradient>
  </defs>

  <!-- ISOTIPO: ESCUDO DE SEGURIDAD PRIVADA -->
  <g transform="translate(10, 10)">
    <!-- Anillo exterior radar -->
    <circle cx="70" cy="70" r="66" stroke="url(#secCyanGrad)" stroke-width="2.5" stroke-dasharray="5 3" opacity="0.9" />
    <circle cx="70" cy="70" r="60" stroke="#ffffff" stroke-width="0.8" opacity="0.25" />
    
    <!-- Escudo Principal -->
    <path d="M70 12 L118 32 C118 80 96 114 70 130 C44 114 22 80 22 32 Z" 
          fill="url(#secShieldGrad)" stroke="url(#secCyanGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Borde cyan interno -->
    <path d="M70 18 L111 36 C111 77 92 106 70 121 C48 106 29 77 29 36 Z" 
          fill="none" stroke="url(#secTealRibbon)" stroke-width="2" opacity="0.95"/>
    
    <!-- Cintas geométricas anguladas -->
    <path d="M34 50 L70 76 L106 50" stroke="#00C4D8" stroke-width="1.2" opacity="0.4" fill="none"/>

    <!-- Estrella 8 puntas guardia -->
    <g transform="translate(70, 62)">
      <circle cx="0" cy="0" r="20" fill="#00C4D8" opacity="0.15" />
      <path d="M0 -24 L5 -7 L22 -7 L8 3 L13 20 L0 10 L-13 20 L-8 3 L-22 -7 L-5 -7 Z" 
            fill="url(#secTealRibbon)" stroke="#ffffff" stroke-width="1"/>
      <circle cx="0" cy="0" r="7" fill="#071626" stroke="#00C4D8" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="#00E5FF"/>
    </g>

    <!-- Laureles -->
    <g stroke="url(#secCyanGrad)" stroke-width="2" fill="none">
      <path d="M38 88 C34 98 42 110 54 116" />
      <path d="M102 88 C106 98 98 110 86 116" />
    </g>

    <!-- Cinta SPD -->
    <path d="M50 118 L70 124 L90 118 L87 125 L70 129 L53 125 Z" fill="url(#secTealRibbon)" />
    <text x="70" y="123" text-anchor="middle" fill="#FFFFFF" font-size="5.5" font-weight="900" font-family="Arial, sans-serif" letter-spacing="1">
      SPD • OS-10
    </text>
  </g>

  <!-- LOGOTIPO / TEXTO OFICIAL (ESTILO EXACTO AL TRÍPTICO) -->
  <g transform="translate(160, 32)">
    <!-- Logo PrevySeg del Folleto -->
    <g transform="translate(0, 0)">
      <text x="0" y="24" fill="#071626" font-size="28" font-weight="900" font-family="Arial, Helvetica, sans-serif" letter-spacing="-0.5">
        Prevy
      </text>
      <text x="78" y="24" fill="#00C4D8" font-size="28" font-weight="300" font-family="Arial, Helvetica, sans-serif">
        Seg
      </text>
      <!-- Subrayado de arco -->
      <path d="M78 28 C95 31 115 31 128 26" stroke="#00C4D8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="132" cy="25" r="2.2" fill="#00C4D8"/>

      <!-- Badge SPD / SENCE -->
      <rect x="145" y="8" width="135" height="18" rx="4" fill="#0A7D8C" fill-opacity="0.12" stroke="#00C4D8" stroke-opacity="0.4"/>
      <text x="212" y="20" text-anchor="middle" fill="#0A7D8C" font-size="9" font-weight="800" font-family="Arial, sans-serif" letter-spacing="0.8">ACREDITACIÓN SPD &amp; SENCE</text>
    </g>

    <!-- Título Principal (Exacto al PDF) -->
    <text x="0" y="62" fill="#071626" font-size="21" font-weight="900" font-family="Arial, Helvetica, sans-serif" letter-spacing="-0.5">
      ESCUELA DE SEGURIDAD PRIVADA
    </text>

    <!-- Bajada del Tríptico -->
    <text x="0" y="84" fill="#0A7D8C" font-size="11" font-weight="700" font-family="Arial, sans-serif">
      Formación y Perfeccionamiento Acreditados • Ley 21.659
    </text>
    <text x="0" y="100" fill="#64748b" font-size="10" font-weight="500" font-family="Arial, sans-serif">
      Guardias OS-10 • Vigilantes Privados • Centrales CCTV • Marítimo Portuario
    </text>
  </g>
</svg>
